# Nginx server block for the self-hosted Next.js frontend.
# Place in /etc/nginx/sites-available/www.example.com.conf and symlink to
# sites-enabled, then `nginx -t && systemctl reload nginx`.
#
# TLS terminates at Cloudflare (orange-cloud DNS). Nginx serves HTTP on :80 only.

server {
  listen 80;
  server_name www.example.com example.com;

  # Real client IP from Cloudflare. Requires the realip module and Cloudflare's
  # published IP ranges (kept up to date via cf-real-ip). See Cloudflare docs.
  set_real_ip_from 173.245.48.0/20;
  set_real_ip_from 103.21.244.0/22;
  real_ip_header CF-Connecting-IP;

  # Max request body for image/avatar uploads through the API proxy (if any).
  client_max_body_size 20M;

  # ---- Next.js ISR / App Router reverse proxy ----
  location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_cache_bypass $http_upgrade;

    # Long-lived CDN-friendly caching for immutable Next.js static assets.
    location ~* ^/_next/static/ {
      proxy_pass http://127.0.0.1:3000;
      add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # next/image optimizer responses are content-hashed by URL params.
    location ~* ^/_next/image {
      proxy_pass http://127.0.0.1:3000;
      add_header Cache-Control "public, max-age=86400, stale-while-revalidate=604800";
    }
  }

  # ---- Backend API (optional: keep behind Cloudflare only if not served elsewhere) ----
  # location /api/ {
  #   proxy_pass http://127.0.0.1:5050;
  #   proxy_set_header Host $host;
  #   proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  #   proxy_set_header X-Forwarded-Proto $scheme;
  # }

  # Deny access to hidden files.
  location ~ /\. {
    deny all;
  }
}